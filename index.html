<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karaoke Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b14">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎤 Karaoke Hub</h1>
  <input id="search" type="search" placeholder="Search title or artist…" aria-label="Search songs">
  <button id="bQueue">Queue (<span id="qc">0</span>)</button>
  <button id="bRefresh">Refresh</button>
  <button id="bSet">Settings</button>
</header>
<nav id="chips"></nav>
<div id="status" role="status"></div>
<main id="home"></main>

<section id="player" hidden>
  <div id="stage">
    <video id="vid" playsinline preload="auto"></video>
    <div id="lyrics"></div>
    <div id="err" hidden></div>
  </div>
  <div id="info"><b id="pt"></b> <span id="pa"></span></div>
  <div id="ctl">
    <button id="bPrev">⏮</button><button id="bPlay">▶</button><button id="bNext">⏭</button>
    <span id="tc">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="td">0:00</span>
    <input id="vol" type="range" min="0" max="1" step="0.05" aria-label="Volume">
    <button id="bShuf">Shuffle</button><button id="bRep">Repeat</button>
    <button id="bA-">A−</button><button id="bA+">A+</button>
    <select id="qual" hidden aria-label="Quality"></select>
    <button id="bQ2">Queue</button><button id="bFs">⛶</button><button id="bClose">✕</button>
  </div>
</section>

<aside id="queue" hidden>
  <h2>Queue</h2><div id="ql"></div>
  <button id="bClr">Clear queue</button><button id="bQx">Close</button>
</aside>

<div id="settings" hidden><div class="box">
  <h2>Settings</h2>
  <label>Song catalog URL <input id="sCat" placeholder="https://USER.github.io/REPO/songs.json"></label>
  <label>Theme <select id="sTheme"><option value="neon">Neon</option><option value="sunset">Sunset</option><option value="ocean">Ocean</option></select></label>
  <label>Default volume <input id="sVol" type="range" min="0" max="1" step="0.05"></label>
  <label>Lyrics size <input id="sLy" type="range" min="20" max="80"></label>
  <label><input id="sAuto" type="checkbox"> Autoplay next song</label>
  <button id="sSave">Save &amp; reload</button><button id="sClear">Clear cached data</button><button id="sX">Close</button>
</div></div>
<script src="app.js"></script>
</body>
</html>
